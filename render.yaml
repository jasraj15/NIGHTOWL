services:
  - type: web
    name: nightowl-api
    runtime: node
    plan: free
    rootDir: .
    # --include=dev: NODE_ENV=production would otherwise skip devDependencies (TypeScript) and the build would fail.
    buildCommand: npm install --include=dev && npm run build --workspace=server
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: NightOwl <onboarding@resend.dev>
      - key: COLLEGE_EMAIL_DOMAIN
        value: sst.scaler.com
      - key: OTP_FALLBACK_DISPLAY
        value: "true"
